services:
  postgres:
    image: postgres:16-alpine
    container_name: rp-postgres
    environment:
      POSTGRES_DB: request_processor
      POSTGRES_USER: rp_user
      POSTGRES_PASSWORD: rp_pass
    ports:
      - "5433:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d
    networks:
      - request-processor-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: rp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - request-processor-network
    healthcheck:
      test: [ "CMD", "bash", "-c", "exit 0" ]

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: rp-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - request-processor-network

  kafka-ui:
    container_name: request-processor-kafka-ui
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Один listener => UI ходит на хост:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: host.docker.internal:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - request-processor-network

volumes:
  rp_pg_data:

networks:
  request-processor-network:
    driver: bridge